<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${modoEdicion} ? 'Editar pedido | Ventas' : 'Nuevo pedido | Ventas'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .navbar { background: #173d32; } .navbar-brand, .nav-link { color: #fff; } .nav-link:hover { color: #b6e2ca; } .page-title { color: #173d32; }</style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark"><div class="container"><a class="navbar-brand fw-semibold" th:href="@{/pedidos}">Ventas</a><div class="navbar-nav"><a class="nav-link" th:href="@{/clientes}">Clientes</a><a class="nav-link" th:href="@{/comerciales}">Comerciales</a><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></div></div></nav>
    <main class="container py-4 py-md-5"><div class="row justify-content-center"><div class="col-12 col-lg-9 col-xl-8">
        <div class="row align-items-end g-3 mb-4"><div class="col"><p class="text-uppercase text-secondary small fw-semibold mb-1">Pedidos</p><h1 class="page-title h2 mb-0" th:text="${modoEdicion} ? 'Editar pedido' : 'Nuevo pedido'"></h1></div><div class="col-auto" th:if="${modoEdicion}"><span class="badge text-bg-light border" th:text="'ID ' + ${pedido.id}"></span></div></div>
        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
        <form class="bg-white border rounded-2 p-3 p-md-4" th:object="${pedido}" th:action="${modoEdicion} ? @{/pedidos/{id}(id=${pedido.id})} : @{/pedidos}" method="post">
            <div class="row g-3">
                <div class="col-12 col-md-6"><label class="form-label" for="total">Total</label><input class="form-control" id="total" type="number" th:field="*{total}" step="0.01" required></div>
                <div class="col-12 col-md-6"><label class="form-label" for="fecha">Fecha</label><input class="form-control" id="fecha" type="date" th:field="*{fecha}"></div>
                <div class="col-12 col-md-6"><label class="form-label" for="clienteId">Cliente</label><select class="form-select" id="clienteId" th:field="*{clienteId}" required><option value="0" disabled>Selecciona un cliente</option><option th:each="cliente : ${listaClientes}" th:value="${cliente.id}" th:text="|${cliente.nombre} ${cliente.apellido1}${cliente.apellido2 != null ? ' ' + cliente.apellido2 : ''}|"></option></select></div>
                <div class="col-12 col-md-6"><label class="form-label" for="comercialId">Comercial</label><select class="form-select" id="comercialId" th:field="*{comercialId}" required><option value="0" disabled>Selecciona un comercial</option><option th:each="comercial : ${listaComerciales}" th:value="${comercial.id}" th:text="|${comercial.nombre} ${comercial.apellido1}${comercial.apellido2 != null ? ' ' + comercial.apellido2 : ''}|"></option></select></div>
                <div class="col-12 d-flex flex-wrap justify-content-end gap-2 pt-2"><a class="btn btn-outline-secondary" th:href="@{/pedidos}">Cancelar</a><button class="btn btn-success" type="submit" th:text="${modoEdicion} ? 'Guardar cambios' : 'Crear pedido'"></button></div>
            </div>
        </form>
    </div></div></main>
</body>
</html>
