<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de comercial | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .navbar { background: #173d32; } .navbar-brand, .nav-link { color: #fff; } .nav-link:hover { color: #b6e2ca; } .page-title { color: #173d32; }</style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark"><div class="container"><a class="navbar-brand fw-semibold" th:href="@{/clientes}">Ventas</a><div class="navbar-nav"><a class="nav-link" th:href="@{/clientes}">Clientes</a><a class="nav-link" th:href="@{/comerciales}">Comerciales</a></div></div></nav>
    <main class="container py-4 py-md-5"><div class="row justify-content-center"><div class="col-12 col-lg-8">
        <p class="text-uppercase text-secondary small fw-semibold mb-1">Comercial</p><h1 class="page-title h2 mb-4" th:text="${comercial.nombre + ' ' + comercial.apellido1}"></h1>
        <dl class="row bg-white border rounded-2 p-3 p-md-4 g-3 mb-4">
            <dt class="col-5 col-md-4">ID</dt><dd class="col-7 col-md-8" th:text="${comercial.id}"></dd><dt class="col-5 col-md-4">Nombre</dt><dd class="col-7 col-md-8" th:text="${comercial.nombre}"></dd><dt class="col-5 col-md-4">Primer apellido</dt><dd class="col-7 col-md-8" th:text="${comercial.apellido1}"></dd><dt class="col-5 col-md-4">Segundo apellido</dt><dd class="col-7 col-md-8" th:text="${comercial.apellido2 ?: '-'}"></dd><dt class="col-5 col-md-4">Comisión</dt><dd class="col-7 col-md-8" th:text="${#numbers.formatDecimal(comercial.comision, 1, 2)}"></dd>
        </dl>
        <div class="d-flex flex-wrap justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/comerciales}">Volver</a><a class="btn btn-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar comercial</a></div>
    </div></div></main>
</body>
</html>
